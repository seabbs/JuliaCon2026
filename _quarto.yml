project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "roadmap/*.qmd"
    - "delays/*.qmd"
    - "composable/*.qmd"

website:
  title: "JuliaCon 2026"
  description: |
    Three talks on composable infectious disease modelling in Julia,
    JuliaCon 2026, Sam Abbott.
  site-url: "https://samabbott.co.uk/JuliaCon2026"
  repo-url: "https://github.com/seabbs/JuliaCon2026"
  favicon: figures/epiaware-logo.svg
  # Off because the index is dominated by slide fragments, which drop the
  # reader into the middle of a deck. seabbs.github.io does the same.
  search: false
  open-graph:
    image: "https://samabbott.co.uk/JuliaCon2026/figures/og-card.png"
    image-width: 1200
    image-height: 630
    image-alt: >-
      JuliaCon 2026, three talks on composable infectious disease modelling
      in Julia, by Sam Abbott, Friday 14 August, Muschel N3.
  twitter-card:
    creator: "@seabbs"
    card-style: summary_large_image
    image: "https://samabbott.co.uk/JuliaCon2026/figures/og-card.png"
    image-width: 1200
    image-height: 630
    image-alt: >-
      JuliaCon 2026, three talks on composable infectious disease modelling
      in Julia, by Sam Abbott, Friday 14 August, Muschel N3.
  navbar:
    title: "JuliaCon 2026"
    logo: figures/epiaware-logo.svg
    left:
      - text: "About"
        href: index.qmd
      - text: "Roadmap"
        href: roadmap/index.qmd
      - text: "Delays"
        href: delays/index.qmd
      - text: "Composable models"
        href: composable/index.qmd
      - text: "Prompts"
        href: prompts.qmd
    right:
      - text: "samabbott.co.uk"
        href: https://samabbott.co.uk
      - icon: github
        href: https://github.com/seabbs/JuliaCon2026
  page-footer:
    left: "Sam Abbott, London School of Hygiene & Tropical Medicine"
    right: "[Source](https://github.com/seabbs/JuliaCon2026)"

format:
  html:
    theme: cosmo
    css: site.css
    toc: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
